<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="東邑庫存">
<meta name="theme-color" content="#16213e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>東邑庫存</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root { --bg:#f1f5f9; --card:#fff; --ink:#0f172a; --mute:#64748b; --line:#e2e8f0; --pri:#1d4ed8; --ok:#16a34a; --bad:#dc2626; --warn:#b45309; --in:#16a34a; --out:#dc2626; --cnt:#1d4ed8; --mode:#16a34a; }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; background: var(--bg); color: var(--ink); font-size: 17px; padding-bottom: env(safe-area-inset-bottom); }
header { background: #16213e; color: #fff; padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top)); display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 1.15rem; letter-spacing: 1px; flex: 1; }
header .who { font-size: .85rem; color: #aac4ff; }
header button { background: rgba(255,255,255,.12); color: #fff; border: 0; border-radius: 8px; padding: 6px 10px; font-size: .85rem; }
.wrap { max-width: 900px; margin: 0 auto; padding: 12px 14px 40px; }
.tabs { display: flex; gap: 8px; margin-bottom: 12px; }
.tabs button { flex: 1; padding: 14px 6px; font-size: 1.15rem; font-weight: 800; border-radius: 12px; border: 3px solid #cbd5e1; background: #fff; color: #94a3b8; }
.tabs button.on.m-in { background: var(--in); border-color: var(--in); color: #fff; }
.tabs button.on.m-out { background: var(--out); border-color: var(--out); color: #fff; }
.tabs button.on.m-count { background: var(--cnt); border-color: var(--cnt); color: #fff; }
.card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
.row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
.row label.l { width: 70px; color: var(--mute); font-size: .95rem; }
select, input.txt { font-size: 1.05rem; padding: 9px 10px; border: 2px solid var(--line); border-radius: 10px; background: #fff; min-width: 0; }
.row select { flex: 1; max-width: 320px; }
.radio label { margin-right: 14px; font-size: 1.05rem; }
.searchrow { display: flex; gap: 8px; }
#q { flex: 1; min-width: 0; font-size: 1.25rem; padding: 13px; border: 3px solid var(--mode); border-radius: 12px; text-transform: uppercase; }
.btn { border: 0; border-radius: 12px; padding: 13px 16px; font-size: 1.05rem; font-weight: 700; color: #fff; background: var(--pri); white-space: nowrap; }
.btn.cam { background: #0f766e; } .btn.photo { background: #7c3aed; }
.btn.gray { background: #94a3b8; } .btn.ok { background: var(--ok); } .btn.mode { background: var(--mode); }
.btn:disabled { opacity: .5; }
.meta { color: var(--mute); font-size: .85rem; margin-top: 8px; }
#reader { margin-top: 12px; display: none; border-radius: 12px; overflow: hidden; }
.res .it { padding: 12px 4px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
.res .it .n { flex: 1; min-width: 0; }
.res .it .n b { display: block; font-size: 1rem; }
.res .it .n span { color: var(--mute); font-size: .85rem; }
.res .it .s { font-weight: 700; font-size: 1.1rem; min-width: 56px; text-align: right; }
.empty { color: var(--mute); text-align: center; padding: 14px; }
/* 清單 */
.li { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; padding: 10px 2px; border-bottom: 1px solid var(--line); }
.li.flash { background: #fef9c3; }
.li .nm b { font-size: 1rem; } .li .nm small { display: block; color: var(--mute); }
.li .nm .fx { color: var(--warn); font-size: .8rem; }
.li .ctl { display: flex; align-items: center; gap: 6px; }
.li .ctl button { width: 40px; height: 40px; border-radius: 50%; border: 0; background: #e2e8f0; font-size: 1.3rem; font-weight: 800; }
.li .ctl input { width: 58px; height: 40px; text-align: center; font-size: 1.2rem; font-weight: 800; border: 2px solid var(--line); border-radius: 8px; }
.li .sub { grid-column: 1 / 3; display: flex; gap: 12px; align-items: center; color: var(--mute); font-size: .9rem; flex-wrap: wrap; }
.li .sub input { width: 80px; padding: 5px; font-size: 1rem; border: 1px solid var(--line); border-radius: 6px; }
.li .del { margin-left: auto; background: #fee2e2; color: var(--bad); border: 0; border-radius: 8px; padding: 6px 12px; font-weight: 700; }
.neg { color: var(--bad); font-weight: 700; } .pos { color: var(--ok); }
.prices { grid-column: 1 / 3; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pbox { border: 1px solid var(--line); border-radius: 10px; padding: 7px 9px; background: #f8fafc; min-width: 0; }
.pbox label { display: block; font-size: .78rem; color: var(--mute); margin-bottom: 3px; }
.pbox .v { font-size: 1.15rem; font-weight: 700; color: var(--mute); }
.pbox .lastinfo { font-size: .72rem; color: var(--mute); margin-top: 2px; line-height: 1.3; }
.pbox input { width: 100%; font-size: 1.15rem; font-weight: 800; padding: 4px 6px; border: 2px solid var(--line); border-radius: 8px; }
.pbox input::-webkit-outer-spin-button, .pbox input::-webkit-inner-spin-button, .li input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.pbox input, .li .ctl input { -moz-appearance: textfield; }
.pbox.chg { background: #fff7ed; border-color: #fdba74; } .pbox.chg input { border-color: #f97316; }
.flag { font-size: .78rem; font-weight: 700; margin-top: 3px; min-height: 16px; }
.up { color: var(--bad); } .down { color: var(--ok); }
.margin { font-size: .78rem; color: var(--mute); margin-top: 3px; } .margin.low { color: var(--bad); font-weight: 700; }
.alert { grid-column: 1 / 3; font-size: .88rem; border-radius: 8px; padding: 6px 10px; display: none; }
.alert.warn { display: block; background: #fff7ed; color: #9a3412; } .alert.bad { display: block; background: #fee2e2; color: #991b1b; }
@media (max-width: 520px) { .prices { grid-template-columns: 1fr 1fr; } .pbox.last { grid-column: 1 / 3; } }
.bar { display: flex; gap: 10px; align-items: center; position: sticky; bottom: 0; background: var(--bg); padding: 10px 0; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
.bar .sum { flex: 1; font-weight: 700; }
.bar .btn { padding: 16px 22px; font-size: 1.15rem; }
/* 盤點 */
.dname { font-size: 1.3rem; font-weight: 800; line-height: 1.35; }
.dcode { color: var(--mute); margin-top: 4px; }
.sys { display: flex; justify-content: space-between; align-items: center; background: #eff6ff; border-radius: 12px; padding: 12px 14px; margin: 14px 0; }
.sys b { font-size: 1.6rem; color: var(--pri); }
.counter { display: flex; align-items: center; gap: 10px; justify-content: center; margin: 6px 0 4px; }
.counter button { width: 72px; height: 72px; border-radius: 50%; border: 0; font-size: 2rem; font-weight: 700; background: #e2e8f0; }
#cnt::-webkit-outer-spin-button, #cnt::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
#cnt { -moz-appearance: textfield; width: 150px; height: 80px; text-align: center; font-size: 2.6rem; font-weight: 800; border: 3px solid var(--pri); border-radius: 14px; }
.diff { text-align: center; font-size: 1.1rem; font-weight: 700; min-height: 30px; margin: 6px 0 12px; }
.actions { display: flex; gap: 10px; } .actions .btn { flex: 1; padding: 18px; font-size: 1.2rem; }
/* 紀錄 */
.h { display: flex; gap: 8px; align-items: center; padding: 9px 2px; border-bottom: 1px solid var(--line); font-size: .95rem; }
.h .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag { border-radius: 999px; padding: 3px 10px; font-size: .8rem; font-weight: 700; white-space: nowrap; }
.t-pending { background: #fef3c7; color: var(--warn); } .t-applied { background: #dcfce7; color: var(--ok); } .t-error { background: #fee2e2; color: var(--bad); }
.k-in { color: var(--in); font-weight: 800; } .k-out { color: var(--out); font-weight: 800; }
h2 { font-size: 1.05rem; margin-bottom: 8px; }
#login { max-width: 420px; margin: 60px auto; }
#login select, #login input { width: 100%; font-size: 1.2rem; padding: 12px; border: 2px solid var(--line); border-radius: 12px; margin: 6px 0 14px; }
#toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: #0f172a; color: #fff; padding: 12px 18px; border-radius: 12px; font-weight: 700; display: none; z-index: 30; max-width: 90%; text-align: center; }
/* 對話框 */
.mask { display: none; position: fixed; inset: 0; background: rgba(15,23,42,.5); z-index: 20; align-items: flex-start; justify-content: center; padding: 30px 14px; overflow: auto; }
.mask.on { display: flex; }
.dlg { background: #fff; border-radius: 16px; padding: 18px; width: 100%; max-width: 520px; }
.dlg h2 { font-size: 1.2rem; margin-bottom: 12px; }
.dlg .row label.l { width: 80px; }
.dlg .row input.txt, .dlg .row select { flex: 1; }
.pick { padding: 12px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; }
.hide { display: none !important; }
</style>
</head>
<body>

<div id="login" class="card" style="display:none">
  <h2>東邑庫存 登入</h2>
  <label>經手人</label>
  <select id="lgName"></select>
  <label>PIN 碼</label>
  <input id="lgPin" type="password" inputmode="numeric" autocomplete="off">
  <button class="btn" style="width:100%" onclick="login()">進入</button>
  <div class="meta" id="lgMsg"></div>
</div>

<div id="app" style="display:none">
  <header>
    <h1>東邑庫存</h1>
    <span class="who" id="who"></span>
    <button onclick="logout()">登出</button>
  </header>
  <div class="wrap">
    <div class="tabs">
      <button id="tIn" class="m-in" onclick="setMode('in')">⬇ 入庫</button>
      <button id="tOut" class="m-out" onclick="setMode('out')">⬆ 出庫</button>
      <button id="tCnt" class="m-count" onclick="setMode('count')">📋 盤點</button>
    </div>

    <div class="card" id="optCard">
      <div class="row" id="optIn"><label class="l">進貨廠商</label><select id="supplier"></select></div>
      <div id="optOut">
        <div class="row radio"><label class="l">出庫方式</label>
          <label><input type="radio" name="ot" id="otT" checked onchange="setOutType()"> 調撥／出貨</label>
          <label><input type="radio" name="ot" id="otI" onchange="setOutType()"> 內部扣庫存</label>
        </div>
        <div class="row" id="optStore"><label class="l">出貨給</label><select id="store"></select></div>
        <div class="row hide" id="optReason"><label class="l">原因</label>
          <select id="reason"><option>內部領用</option><option>盤點修正</option><option>報廢</option><option>退貨給廠商</option><option>其他</option></select></div>
      </div>
    </div>

    <div class="card">
      <div class="searchrow">
        <input id="q" placeholder="掃描／輸入料號或名稱" autocomplete="off" enterkeyhint="search">
        <button class="btn cam" id="camBtn" onclick="toggleCam()">📷</button>
        <button class="btn photo" onclick="document.getElementById('photo').click()">📸</button>
        <input type="file" id="photo" accept="image/*" capture="environment" style="display:none">
      </div>
      <div id="inapp" class="meta" style="display:none;color:var(--bad);font-weight:700"></div>
      <div id="reader"></div>
      <div class="meta" id="camMsg"></div>
      <div class="meta" id="meta">讀取材料庫中…</div>
      <div class="res" id="res"></div>
    </div>

    <!-- 入庫／出庫 清單 -->
    <div class="card" id="listCard">
      <h2 id="listTitle">入庫清單</h2>
      <div id="list"><div class="empty">掃描後會加到這裡（同一件掃多次自動 +1）</div></div>
    </div>
    <div class="bar" id="listBar">
      <span class="sum" id="sum"></span>
      <button class="btn gray" onclick="clearList()">清空</button>
      <button class="btn mode" id="sendBtn" onclick="submitList()">一鍵送出</button>
    </div>

    <!-- 盤點 -->
    <div class="card hide" id="detail">
      <div class="dname" id="dName"></div>
      <div class="dcode" id="dCode"></div>
      <div class="sys"><span>東邑目前庫存</span><b id="dStock">-</b></div>
      <div style="text-align:center;color:var(--mute);margin-bottom:4px">實際盤點數量</div>
      <div class="counter">
        <button onclick="bump(-1)">−</button>
        <input id="cnt" type="number" inputmode="numeric" min="0">
        <button onclick="bump(1)">＋</button>
      </div>
      <div class="diff" id="dDiff"></div>
      <div class="actions">
        <button class="btn gray" onclick="closeDetail()">取消</button>
        <button class="btn ok" id="cntBtn" onclick="submitCount()">送出並寫回東邑</button>
      </div>
    </div>

    <div class="card">
      <h2 id="histTitle">今天的紀錄</h2>
      <div id="hist"><div class="empty">還沒有紀錄</div></div>
    </div>
  </div>
</div>

<!-- 多筆符合 -->
<div class="mask" id="mPick"><div class="dlg">
  <h2>對到多筆材料，請選一筆</h2>
  <div id="pickList"></div>
  <button class="btn gray" style="width:100%" onclick="closeDlg()">取消</button>
</div></div>

<!-- 新增材料 -->
<div class="mask" id="mNew"><div class="dlg">
  <h2>材料庫找不到，新增材料</h2>
  <div class="row"><label class="l">料號</label><input class="txt" id="nCode"></div>
  <div class="row"><label class="l">項目名稱</label><input class="txt" id="nName" maxlength="50"></div>
  <div class="row"><label class="l">類別</label><select id="nCat"></select></div>
  <div class="row"><label class="l">進價</label><input class="txt" id="nIn" type="number" inputmode="numeric" value="0"></div>
  <div class="row"><label class="l">售價</label><input class="txt" id="nOut" type="number" inputmode="numeric" value="0"></div>
  <div class="row"><label class="l">安全庫存</label><input class="txt" id="nSafe" type="number" inputmode="numeric" value="0"></div>
  <div class="row"><label class="l">適用</label><input class="txt" id="nApp" maxlength="20" placeholder="例：山葉、光陽（可空白）"></div>
  <div class="meta" id="nMsg">建立後會寫入東邑材料庫（庫存 0），再加入清單。</div>
  <div class="actions" style="margin-top:12px">
    <button class="btn gray" onclick="closeDlg()">取消</button>
    <button class="btn ok" id="nBtn" onclick="createItem()">建立</button>
  </div>
</div></div>

<div id="toast"></div>

<script>
var SB_URL = "https://hxzdmosganinyhtrswlj.supabase.co";
var SB_KEY = "sb_publishable_AYWfHD9vBAVk4Fv1tcuEVw_RTPM71RQ";
var STAFF = ["超級帥榮", "光", "俊維", "阿霖仔", "中寶", "阿信", "阿傑", "Ka", "永鈞", "阿賢大師"];
var items = [], byKey = {}, pin = "", who = "", mode = "in", scanner = null;
var lists = { in: [], out: [] };          // 入庫／出庫清單（草稿存在本機）
var cur = null, curStock = 0;             // 盤點中的材料
var histMoves = [], histCounts = [], pickHits = [], lastQ = "";

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function toast(t, ms) { var e = $("toast"); e.textContent = t; e.style.display = "block"; clearTimeout(e._t); e._t = setTimeout(function () { e.style.display = "none"; }, ms || 2200); }
function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function buzz(ok) { try { if (navigator.vibrate) navigator.vibrate(ok ? 60 : [80, 60, 80]); } catch (e) {} }

function api(path, opt) {
  opt = opt || {};
  var h = { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY, "Content-Type": "application/json" };
  for (var k in (opt.headers || {})) h[k] = opt.headers[k];
  return fetch(SB_URL + path, { method: opt.method || "GET", headers: h, body: opt.body ? JSON.stringify(opt.body) : undefined })
    .then(function (r) { return r.text().then(function (t) { var d = t ? JSON.parse(t) : null; if (!r.ok) throw new Error((d && (d.message || d.hint)) || ("HTTP " + r.status)); return d; }); });
}
function rpc(fn, body) { return api("/rest/v1/rpc/" + fn, { method: "POST", body: body }); }

// ---------- 條碼正規化（與入庫程式、條碼轉換 AHK 相同規則） ----------
var PGO = /^(A[0-9FR]|B[AF]|C[0-9]|J[0-9DR]|M2|P[0-9]|XC|ES|F7)/;
function key(s) { return String(s || "").toUpperCase().replace(/[\s\-]/g, ""); }
function toProper(raw) {
  var b = key(raw);
  if (!b || /-/.test(String(raw)) || PGO.test(b)) return String(raw || "").trim().toUpperCase();
  if (/^[0-9B][0-9A-Z]{7}[0-9]{2}$/.test(b) && !/^\d{10}$/.test(b) && !/^B\d\dN/.test(b)) return b.substr(0, 3) + "-" + b.substr(3, 5) + "-" + b.substr(8, 2);
  if (/^[0-9A-Z]{12}$/.test(b)) {
    if (/^9[0-9A-Z]{2}[0-9][0-9A-Z]{6}00$/.test(b)) return b.substr(0, 5) + "-" + b.substr(5, 5);
    if (/^\d{5}/.test(b)) return b;
    var base = b.substr(0, 3) + "-" + b.substr(3, 5) + "-" + b.substr(8, 2), c = b.substr(10, 2);
    return c === "00" ? base : base + "-" + c;
  }
  return String(raw).trim().toUpperCase();
}
function looksLikeCode(s) { return /^[0-9A-Z\-]{8,}$/i.test(String(s || "").trim()); }
function properOf(it) { return it.barcode && looksLikeCode(it.barcode) ? toProper(it.barcode) : (it.barcode || ""); }
function needsFix(it) { var p = properOf(it); return p && p !== String(it.barcode || "").toUpperCase() ? p : ""; }

// ---------- 登入 ----------
function fillSelect(sel, arr, blank) {
  var keep = sel.value; sel.innerHTML = (blank ? '<option value="">' + esc(blank) + '</option>' : "") +
    arr.map(function (x) { return '<option>' + esc(x) + '</option>'; }).join("");
  if (keep) sel.value = keep;
}
function login() {
  var p = $("lgPin").value.trim(), n = $("lgName").value;
  if (!p) return;
  $("lgMsg").textContent = "確認中…";
  rpc("check_stocktake_pin", { p_pin: p }).then(function (ok) {
    if (!ok) { $("lgMsg").textContent = "PIN 碼錯誤"; return; }
    pin = p; who = n; store("st_pin", p); store("st_who", n); start();
  }).catch(function (e) { $("lgMsg").textContent = "連線失敗：" + e.message; });
}
function logout() { store("st_pin", null); pin = ""; stopCam(); $("app").style.display = "none"; $("login").style.display = "block"; }

var started = false;
function start() {
  $("login").style.display = "none"; $("app").style.display = "block"; $("who").textContent = who;
  if (started) return; started = true;
  try { lists = JSON.parse(load("st_lists") || "") || lists; } catch (e) {}
  if (!lists.in) lists.in = []; if (!lists.out) lists.out = [];
  loadLists(); loadItems(); loadHist();
  setMode(load("st_mode") || "in");
  setInterval(poll, 3000);
}

// ---------- 東邑清單（廠商／分店／人員／類別） ----------
function loadLists() {
  api("/rest/v1/app_lists?select=kind,names").then(function (r) {
    var m = {}; (r || []).forEach(function (x) { m[x.kind] = x.names || []; });
    if (m.staff && m.staff.length) { STAFF = m.staff; fillSelect($("lgName"), STAFF); $("lgName").value = who || STAFF[0]; }
    fillSelect($("supplier"), m.supplier || [], "（不指定）");
    fillSelect($("store"), m.store || [], "（不指定）");
    var cats = (m.category || ["0|其它", "18|雜項秏材"]);
    $("nCat").innerHTML = cats.map(function (c) { var p = c.split("|"); return '<option value="' + esc(p[0]) + '">' + esc(p[1] || p[0]) + '</option>'; }).join("");
    $("nCat").value = "18";
    var s = load("st_supplier"); if (s) $("supplier").value = s;
    var st = load("st_store"); if (st) $("store").value = st;
  }).catch(function () {});
}

// ---------- 材料庫 ----------
function loadItems() {
  items = []; byKey = {};
  var page = 0, size = 1000;
  function next() {
    return api("/rest/v1/inventory?select=id,name,barcode,stock,in_price,default_price,applicably,updated_at,last_in_date,last_in_supplier,last_in_price&active=eq.true&order=id", { headers: { Range: (page * size) + "-" + (page * size + size - 1) } })

function updPrices(i) {

function poll() {

  var ci = histCounts.filter(function (h) { return h.status === "pending"; }).map(function (h) { return h.id; });

      arr.forEach(function (h) {

  if (ci.length) api("/rest/v1/stocktake?select=id,status,stock_after,error,part_id&id=in.(" + ci.join(",") + ")").then(function (r) { upd(histCounts, r); }).catch(function () {});

function showPick(hits) {
  pickHits = hits; buzz(false);
  $("pickList").innerHTML = hits.map(function (it, i) {
    return '<div class="pick" onclick="closeDlg();pickItem(pickHits[' + i + '])"><b>' + esc(it.name) + '</b><br><small>' + esc(properOf(it)) + '　編號 ' + it.id + '・庫存 ' + it.stock + '</small></div>';
  }).join("");
  $("mPick").classList.add("on");
}
function closeDlg() { $("mPick").classList.remove("on"); $("mNew").classList.remove("on"); }

// ---------- 相機 ----------
function camMsg(t) { $("camMsg").textContent = t || ""; }
function fmts() { var F = Html5QrcodeSupportedFormats; return [F.CODE_128, F.CODE_39, F.CODE_93, F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.ITF, F.CODABAR, F.QR_CODE]; }
function toggleCam() { scanner ? stopCam() : startCam(); }
function startCam() {
  if (!window.Html5Qrcode) { toast("掃描元件載入失敗，請檢查網路"); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { camMsg("這個瀏覽器不支援即時相機，請改用 📸 拍照，或用 Chrome / Safari 開啟"); return; }
  $("reader").style.display = "block"; $("camBtn").textContent = "✕";
  camMsg("開啟相機中…條碼放在框內、距離 10～20 公分");
  scanner = new Html5Qrcode("reader", { formatsToSupport: fmts(), verbose: false, experimentalFeatures: { useBarCodeDetectorIfSupported: true } });
  scanner.start({ facingMode: "environment" }, { fps: 15, aspectRatio: 1.7778, disableFlip: true,
      qrbox: function (w, h) { return { width: Math.floor(w * 0.9), height: Math.max(80, Math.floor(h * 0.45)) }; },
      videoConstraints: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 }, advanced: [{ focusMode: "continuous" }] } },
    function (txt) { stopCam(); search(txt); }, function () {})
  .then(function () { camMsg("相機已開啟，對準條碼（掃不到可改用 📸 拍照）"); })
  .catch(function (e) {
    var m = String(e && (e.name || e.message) || e);
    camMsg(/NotAllowed|Permission/i.test(m) ? "相機權限被拒絕：請到瀏覽器設定允許這個網站使用相機" : /NotFound/i.test(m) ? "找不到相機" :
           /NotReadable|TrackStart/i.test(m) ? "相機被其他 App 占用" : "無法開啟相機：" + m);
    stopCam();
  });
}
function stopCam() {
  if (scanner) { var s = scanner; scanner = null;
    try { var p = s.stop(); if (p && p.then) p.catch(function () {}).then(function () { try { s.clear(); } catch (e) {} }); else s.clear(); } catch (e) { try { s.clear(); } catch (e2) {} } }
  $("reader").style.display = "none"; $("camBtn").textContent = "📷";
}
function scanPhoto(file) {
  if (!file) return;
  if (!window.Html5Qrcode) { toast("掃描元件載入失敗"); return; }
  camMsg("辨識照片中…");
  var tmp = new Html5Qrcode("reader", { formatsToSupport: fmts(), verbose: false, experimentalFeatures: { useBarCodeDetectorIfSupported: true } });
  tmp.scanFile(file, false).then(function (txt) { camMsg(""); search(txt); })
    .catch(function () { camMsg("照片裡找不到條碼：靠近一點、條碼橫放、拍清楚再試"); buzz(false); })
    .then(function () { try { tmp.clear(); } catch (e) {} $("photo").value = ""; });
}

// ---------- 啟動 ----------
$("photo").addEventListener("change", function () { scanPhoto(this.files && this.files[0]); });
$("q").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); search(this.value); } });
$("q").addEventListener("input", function () { var v = this.value.trim(); if (v.length >= 2 && !looksLikeCode(v)) search(v); else if (!v) $("res").innerHTML = ""; });
$("cnt").addEventListener("input", showDiff);
$("cnt").addEventListener("keydown", function (e) { if (e.key === "Enter") submitCount(); });
$("otT").addEventListener("change", renderList); $("otI").addEventListener("change", renderList);
$("supplier").addEventListener("change", function () { store("st_supplier", this.value); });
$("store").addEventListener("change", function () { store("st_store", this.value); });
document.addEventListener("visibilitychange", function () { if (!document.hidden && pin) loadHist(); });
(function () { var ua = navigator.userAgent;
  if (/Line\/|FBAN|FBAV|Instagram|MicroMessenger/i.test(ua)) { var e = $("inapp"); e.style.display = "block"; e.textContent = "⚠ 你正在 LINE／FB 內建瀏覽器，相機常常不能用。請按右上角「⋯」→ 用 Chrome 或 Safari 開啟"; }
})();
if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); }); }

fillSelect($("lgName"), STAFF);
api("/rest/v1/app_lists?select=names&kind=eq.staff").then(function (r) { if (r && r[0] && r[0].names.length) { STAFF = r[0].names; fillSelect($("lgName"), STAFF); var n = load("st_who"); if (n) $("lgName").value = n; } }).catch(function () {});
(function () {
  var p = load("st_pin"), n = load("st_who");
  if (n) $("lgName").value = n;
  if (p && n) {
    rpc("check_stocktake_pin", { p_pin: p }).then(function (ok) { if (ok) { pin = p; who = n; start(); } else $("login").style.display = "block"; })
      .catch(function () { $("login").style.display = "block"; });
  } else $("login").style.display = "block";
})();
</script>
